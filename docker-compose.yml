version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vishwakarma_kutumb
    ports:
      - '5432:5432'
    volumes:
      - vk_postgres_data:/var/lib/postgresql/data
volumes:
  vk_postgres_data:
